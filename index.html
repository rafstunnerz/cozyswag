<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COZYSWAG</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f2f2f2;color:#111;overflow:hidden}
#gate{position:fixed;inset:0;z-index:999;background:#000;display:flex;align-items:center;justify-content:center;transition:.8s}
#gate video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6;pointer-events:none}
.menu{position:relative;z-index:10;text-align:center;color:#fff;display:flex;flex-direction:column;align-items:center}
.menu-gif{width:360px;max-width:70vw}
.link{font-family:'Bebas Neue';font-size:78px;line-height:.9;letter-spacing:2px;cursor:pointer}
.link:hover{-webkit-text-stroke:1px #fff;color:transparent}
#gate.out{transform:translateY(-100%)}
#main{display:none;min-height:100vh}#main.show{display:block}
.page{display:none}.page.active{display:block}
header{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(242,242,242,.95);border-bottom:1px solid #e5e5e5;z-index:30}
.header-center{position:absolute;left:50%;transform:translateX(-50%)}
.nav-link{font-family:'Space Grotesk';font-size:10px;letter-spacing:3px;font-weight:700;opacity:.4;cursor:pointer}
.nav-link.active{opacity:1;border-bottom:1px solid #111}
.back{font-family:'Space Grotesk';font-size:10px;font-weight:700;padding:8px 16px;border:1px solid #111;border-radius:20px;cursor:pointer}
.header-logo{height:48px;cursor:pointer}
.title{font-family:'Syne';font-size:20px;font-weight:800;letter-spacing:2px;text-align:center;padding:28px 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#e5e5e5}
.card{background:#f2f2f2;padding:0 0 26px;display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative}
.img-wrap{position:relative;width:100%;height:360px;background:#f2f2f2;overflow:hidden}
.img-wrap .img-main{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:1;z-index:1;transition:opacity .4s ease, transform .6s ease}
.img-wrap .img-hover{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;z-index:2;transition:opacity .4s ease, transform .6s ease}
.card:hover .img-main{opacity:0;transform:scale(1.06)}
.card:hover .img-hover{opacity:1;transform:scale(1.06)}
.card p{font-family:'Space Grotesk';font-size:11px;font-weight:700;margin-top:14px;text-transform:uppercase}
.soldout-pill{position:absolute;bottom:58px;left:50%;transform:translateX(-50%);border:1px solid #111;background:#fff;border-radius:20px;padding:5px 14px;font-size:9px;font-weight:800}
.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#e5e5e5}
.gallery-card{aspect-ratio:4/5;background:#000;overflow:hidden;cursor:pointer}
.gallery-card img{width:100%;height:100%;object-fit:cover}
#productPage{position:fixed;inset:0;z-index:90;background:#f2f2f2;display:none;overflow:auto}
#productPage.show{display:block}
.p-header{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#f2f2f2;border-bottom:1px solid #e5e5e5}
.p-body{display:grid;grid-template-columns:1.2fr .8fr;min-height:calc(100vh - 56px)}
.p-img-side{background:#ececec;display:flex;flex-direction:column}
.p-img-main{flex:1;padding:30px;display:flex;align-items:center;justify-content:center;min-height:500px;position:relative}
.p-img-main img{width:100%;max-width:500px;object-fit:contain}
.thumbs{display:flex;gap:8px;padding:12px;overflow:auto;background:#ececec}
.thumb{width:80px;height:80px;min-width:80px;background:#fff;border:1.5px solid transparent;cursor:pointer}
.thumb.active{border-color:#111}
.thumb img{width:100%;height:100%;object-fit:cover}
.p-info{padding:32px 28px}
.p-info h1{font-family:'Syne';font-size:28px;line-height:.9}
.sizes{display:flex;gap:8px;margin-top:14px}
.size{width:36px;height:36px;border:1px solid #111;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;cursor:pointer}
.size.active{background:#111;color:#fff}
.btn{width:100%;padding:14px;border-radius:30px;border:0;font-weight:900;margin-top:12px;cursor:pointer;font-family:'Space Grotesk';font-size:11px}
.btn-black{background:#111;color:#fff}
#cartOverlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none}
#cartOverlay.show{display:block}
#cartDrawer{position:fixed;top:0;right:0;width:400px;max-width:92vw;height:100%;background:#f2f2f2;z-index:201;transform:translateX(100%);transition:.4s;display:flex;flex-direction:column}
#cartDrawer.show{transform:translateX(0)}
.cart-head{padding:20px;display:flex;justify-content:space-between;border-bottom:1px solid #e5e5e5}
.cart-items{flex:1;overflow:auto;padding:0 20px}
@media(max-width:800px){.link{font-size:56px}.p-body{grid-template-columns:1fr}.img-wrap{height:260px}}
</style>
</head>
<body>
<div id="gate">
<video autoplay loop muted playsinline><source src="https://i.imgur.com/ML8T7V0.mp4" type="video/mp4"></video>
<div class="menu">
<img class="menu-gif" src="https://i.imgur.com/cvLNJry.gif">
<div class="link" onclick="enterStore()">COLLECTION</div>
<div class="link" onclick="enterGallery()">GALLERY</div>
<div class="link" onclick="window.open('https://www.facebook.com/profile.php?id=61553410621994','_blank')">STORY</div>
</div>
</div>
<div id="main">
<header>
<div><div class="back" onclick="handleBack()">← BACK</div></div>
<div class="header-center"><img class="header-logo" src="https://i.imgur.com/cvLNJry.gif"></div>
<div style="display:flex;gap:16px;align-items:center">
<span id="navStore" class="nav-link active" onclick="showStoreTab()">STORE</span>
<span id="navGallery" class="nav-link" onclick="showGalleryTab()">GALLERY</span>
</div>
</header>
<div id="storePage" class="page"><div class="title">NEW COLLECTION</div><div class="grid2" id="storeGrid"></div></div>
<div id="galleryPage" class="page"><div class="title">GALLERY</div><div class="gallery-grid" id="galleryGrid"></div></div>
<audio id="audio" loop><source src="./sorry.mp3"></audio>
</div>
<div id="productPage">
<div class="p-header"><div class="back" onclick="backFromProduct()">← BACK</div><img class="header-logo" src="https://i.imgur.com/cvLNJry.gif"></div>
<div class="p-body">
<div class="p-img-side"><div class="p-img-main"><img id="pImg"></div><div class="thumbs" id="thumbs"></div></div>
<div class="p-info"><h1 id="pName"></h1><div class="sizes"><div class="size active" onclick="pickSize(this)">S</div><div class="size" onclick="pickSize(this)">M</div><div class="size" onclick="pickSize(this)">L</div><div class="size" onclick="pickSize(this)">XL</div><div class="size" onclick="pickSize(this)">2XL</div></div><button class="btn btn-black" onclick="addToCart()">ADD TO CART</button></div>
</div>
</div>
<script>
const tees=[
{name:"COZY TEE BLACK",images:["https://i.imgur.com/rM9FnTG.png","https://i.imgur.com/IW3vnNm.jpeg"],soldout:true},
{name:"COZY TEE WHITE",images:["https://i.imgur.com/y1bwuFF.png","https://i.imgur.com/ch2Pxg3.jpeg"],soldout:false},
{name:"COZY SHORTS BLACK",images:["https://i.imgur.com/TYSYmj1.png","https://i.imgur.com/f0rMVGu.jpeg"],soldout:false},
{name:"COZY SHORTS WHITE",images:["https://i.imgur.com/7tNmDFO.png","https://i.imgur.com/X4A2kot.jpeg"],soldout:false},
{name:"COZY TEE GREY",images:["https://i.imgur.com/CDKuXxt.png","https://i.imgur.com/Hbr1wFd.jpeg"],soldout:false},
{name:"COZY TEE CREAM",images:["https://i.imgur.com/e6rIBlV.png","https://i.imgur.com/srf1dOA.jpeg"],soldout:false},
{name:"COZY HOODIE BLACK",images:["https://i.imgur.com/ty9cyvl.png","https://i.imgur.com/IWqEKkJ.jpeg"],soldout:false},
{name:"COZY HOODIE WHITE",images:["https://i.imgur.com/HOqhErH.png","https://i.imgur.com/o1UOJrQ.jpeg"],soldout:false},
];
const galleryPics=["https://i.imgur.com/ZUE63Du.jpeg","https://i.imgur.com/S33CFqt.jpeg","https://i.imgur.com/mrPv4Lg.jpeg"];
let current=null,currentPage='store';
function renderStore(){
document.getElementById('storeGrid').innerHTML=tees.map((t,i)=>`
<div class="card" onclick="openProduct(${i})">
<div class="img-wrap">
<img class="img-main" src="${t.images[0]}">
<img class="img-hover" src="${t.images[1]}">
</div>
<p>${t.name}</p>
${t.soldout?'<div class="soldout-pill">Sold out</div>':''}
</div>`).join("");
}
renderStore();
function showStoreTab(){currentPage='store';document.getElementById('storePage').classList.add('active');document.getElementById('galleryPage').classList.remove('active');document.getElementById('navStore').classList.add('active');document.getElementById('navGallery').classList.remove('active')}
function showGalleryTab(){currentPage='gallery';document.getElementById('galleryPage').classList.add('active');document.getElementById('storePage').classList.remove('active');document.getElementById('navGallery').classList.add('active');document.getElementById('navStore').classList.remove('active')}
function handleBack(){if(currentPage==='store'){goToIntro()}else{showStoreTab()}}
function backFromProduct(){document.getElementById('productPage').classList.remove('show')}
function goToIntro(){let g=document.getElementById('gate');g.style.display='flex';setTimeout(()=>g.classList.remove('out'),10);document.getElementById('main').classList.remove('show')}
function openProduct(i){current=tees[i];document.getElementById('pName').innerText=current.name;document.getElementById('pImg').src=current.images[0];document.getElementById('thumbs').innerHTML=current.images.map((im,idx)=>`<div class="thumb ${idx===0?'active':''}" onclick="document.getElementById('pImg').src='${im}'"><img src="${im}"></div>`).join("");document.getElementById('productPage').classList.add('show')}
function enterStore(){document.getElementById('gate').classList.add('out');setTimeout(()=>{document.getElementById('gate').style.display='none';document.getElementById('main').classList.add('show');showStoreTab()},700);try{document.getElementById('audio').play()}catch(e){}}
function enterGallery(){document.getElementById('gate').classList.add('out');setTimeout(()=>{document.getElementById('gate').style.display='none';document.getElementById('main').classList.add('show');showGalleryTab()},700);try{document.getElementById('audio').play()}catch(e){}}
function pickSize(el){document.querySelectorAll('.size').forEach(s=>s.classList.remove('active'));el.classList.add('active')}
function addToCart(){alert('Added')}
</script>
</body>
</html>
