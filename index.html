<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COZYSWAG®</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f2f2f2;color:#111;overflow:hidden}
#gate{position:fixed;inset:0;z-index:999;background:#000;display:flex;align-items:center;justify-content:center;transition:.8s}
#gate video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6;pointer-events:none}
.menu{position:relative;z-index:10;text-align:center;color:#fff;display:flex;flex-direction:column;align-items:center;pointer-events:auto}
.menu-gif{width:360px;max-width:70vw;pointer-events:none}
.menu.link{font-family:'Bebas Neue';font-size:78px;line-height:.9;letter-spacing:2px;cursor:pointer;pointer-events:auto}
.menu.link:hover{-webkit-text-stroke:1px #fff;color:transparent}
#gate.out{transform:translateY(-100%);pointer-events:none}
#main{display:none;background:#f2f2f2;min-height:100vh}#main.show{display:block}
.page{display:none}.page.active{display:block}
header{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#f2f2f2f2;backdrop-filter:blur(12px);border-bottom:1px solid #e5e5e5;z-index:30}
.header-center{position:absolute;left:50%;transform:translateX(-50%)}
.nav-link{font-family:'Space Grotesk';font-size:10px;letter-spacing:3px;font-weight:700;opacity:.4;cursor:pointer}
.nav-link.active{opacity:1;border-bottom:1px solid #111}
.icon-btn{width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px;stroke:#111;stroke-width:1.6;fill:none}
.back{font-family:'Space Grotesk';font-size:10px;font-weight:700;padding:8px 16px;border:1px solid #111;border-radius:20px;cursor:pointer}
.header-logo{height:48px;cursor:pointer}
.title{font-family:'Syne';font-size:20px;font-weight:800;letter-spacing:2px;text-align:center;padding:28px 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#e5e5e5;border-top:1px solid #e5e5e5;border-bottom:1px solid #e5e5e5}
.card{background:#f2f2f2;padding:0 0 26px;display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative}

/* ITO YUNG TAMA NA HOVER - MAY SPACE NA */
.img-wrap{position:relative;width:100%;height:360px;background:#f2f2f2;overflow:hidden}
.img-wrap.img-main{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;opacity:1;z-index:1;transition:opacity.4s ease, transform.6s ease}
.img-wrap.img-hover{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;opacity:0;z-index:2;transition:opacity.4s ease, transform.6s ease}
.card:hover.img-main{opacity:0;transform:scale(1.06)}
.card:hover.img-hover{opacity:1;transform:scale(1.06)}

.card p{font-family:'Space Grotesk';font-size:11px;font-weight:700;margin-top:14px;letter-spacing:1px;text-transform:uppercase}
.soldout-pill{position:absolute;bottom:58px;left:50%;transform:translateX(-50%);border:1px solid #111;background:#fff;border-radius:20px;padding:5px 14px;font-size:9px;font-weight:800}
.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#e5e5e5}
.gallery-card{aspect-ratio:4/5;background:#000;overflow:hidden;cursor:pointer}
.gallery-card img{width:100%;height:100%;object-fit:cover}
#searchOverlay{position:fixed;inset:0;z-index:500;background:#f2f2f2;display:none;flex-direction:column}
#searchOverlay.show{display:flex}
.search-top{padding:14px 20px;display:flex;gap:12px;border-bottom:1px solid #e5e5e5}
.search-top input{flex:1;border:0;background:0;outline:0;font-family:'Space Grotesk';font-weight:700}
.search-results{flex:1;overflow:auto}
.search-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#e5e5e5}
#productPage{position:fixed;inset:0;z-index:90;background:#f2f2f2;display:none;overflow:auto}
#productPage.show{display:block}
.p-header{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#f2f2f2;border-bottom:1px solid #e5e5e5}
.p-body{display:grid;grid-template-columns:1.2fr.8fr;min-height:calc(100vh - 56px)}
.p-img-side{background:#ececec;display:flex;flex-direction:column}
.p-img-main{flex:1;padding:30px;display:flex;align-items:center;justify-content:center;min-height:500px;position:relative}
.p-img-main img{width:100%;max-width:500px;object-fit:contain}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;background:#fff;border:1px solid #111;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:900}
.arrow.left{left:12px}.arrow.right{right:12px}
.thumbs{display:flex;gap:8px;padding:12px;overflow:auto;background:#ececec;border-top:1px solid #ddd}
.thumb{width:80px;height:80px;min-width:80px;background:#fff;border:1.5px solid transparent;cursor:pointer}
.thumb.active{border-color:#111}
.thumb img{width:100%;height:100%;object-fit:cover}
.p-info{padding:32px 28px}
.p-info h1{font-family:'Syne';font-size:28px;line-height:.9;margin-bottom:6px}
.sizes{display:flex;gap:8px;margin-top:14px}
.size{width:36px;height:36px;border:1px solid #111;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;cursor:pointer}
.size.active{background:#111;color:#fff}
.btn{width:100%;padding:14px;border-radius:30px;border:0;font-weight:900;margin-top:12px;cursor:pointer;font-family:'Space Grotesk';font-size:11px;letter-spacing:1px}
.btn-black{background:#111;color:#fff}
.btn-black2{background:#111;color:#fff}
.sizechart-btn{margin-top:14px;font-size:10px;letter-spacing:2px;text-decoration:underline;cursor:pointer;opacity:.6}
#sizeChartModal{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center}
#sizeChartModal.show{display:flex}
#sizeChartModal img{max-width:90vw;max-height:85vh;background:#fff;padding:8px;border-radius:8px}
#cartOverlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none}
#cartOverlay.show{display:block}
#cartDrawer{position:fixed;top:0;right:0;width:400px;max-width:92vw;height:100%;background:#f2f2f2;z-index:201;transform:translateX(100%);transition:.4s;display:flex;flex-direction:column}
#cartDrawer.show{transform:translateX(0)}
.cart-head{padding:20px;display:flex;justify-content:space-between;border-bottom:1px solid #e5e5e5}
.cart-head h2{font-family:'Bebas Neue';font-size:20px}
.cart-items{flex:1;overflow:auto;padding:0 20px}
.cart-badge{position:absolute;top:-4px;right:-6px;background:#111;color:#fff;font-size:9px;min-width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}
#loader{position:fixed;inset:0;z-index:9999;background:#f2f2f2;display:none;align-items:center;justify-content:center;flex-direction:column}
#loader.show{display:flex}
#loader img{width:66px;animation:spin.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:800px){.menu.link{font-size:56px}.p-body{grid-template-columns:1fr}.img-wrap{height:260px}}
</style>
</head>
<body>
<div id="gate">
<video autoplay loop muted playsinline><source src="https://i.imgur.com/ML8T7V0.mp4" type="video/mp4"></video>
<div class="menu">
<img class="menu-gif" src="https://i.imgur.com/cvLNJry.gif">
<div class="link" onclick="enterStore()">COLLECTION</div>
<div class="link" onclick="enterGallery()">GALLERY</div>
<div class="link" onclick="window.open('https://www.facebook.com/profile.php?id=61553410621994','_blank')">STORY</div>
</div>
</div>
<div id="main">
<header>
<div><div class="back" onclick="handleBack()">← BACK</div></div>
<div class="header-center"><img class="header-logo" src="https://i.imgur.com/cvLNJry.gif" onclick="handleBack()"></div>
<div style="display:flex;gap:16px;align-items:center">
<span id="navStore" class="nav-link active" onclick="showStoreTab()">STORE</span>
<span id="navGallery" class="nav-link" onclick="showGalleryTab()">GALLERY</span>
<div class="icon-btn" onclick="openSearch()"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16L20 20"/></svg></div>
<div class="icon-btn" onclick="openCart()"><svg viewBox="0 0 24 24"><path d="M4 6h16l-1.5 12h-13z"/><path d="M8 6V4a4 4 0 0 1 8 0v2"/></svg><div id="badge" class="cart-badge" style="display:none">0</div></div>
</div>
</header>
<div id="storePage" class="page"><div class="title">NEW COLLECTION</div><div class="grid2" id="storeGrid"></div></div>
<div id="galleryPage" class="page"><div class="title">GALLERY</div><div class="gallery-grid" id="galleryGrid"></div></div>
<audio id="audio" loop><source src="./sorry.mp3" type="audio/mpeg"></audio>
</div>
<div id="loader"><img src="https://i.imgur.com/cvLNJry.gif"></div>
<div id="searchOverlay"><div class="search-top"><div onclick="closeSearch()" style="cursor:pointer;font-weight:900">✕</div><input id="searchInput" placeholder="Search..." oninput="doSearch(this.value)"></div><div class="search-results"><div id="searchGrid" class="search-grid"></div></div></div>
<div id="productPage">
<div class="p-header"><div class="back" onclick="backFromProduct()">← BACK</div><img class="header-logo" src="https://i.imgur.com/cvLNJry.gif" onclick="backFromProduct()"><div class="icon-btn" onclick="openCart()"><svg viewBox="0 0 24 24"><path d="M4 6h16l-1.5 12h-13z"/><path d="M8 6V4a4 4 0 0 1 8 0v2"/></svg><div id="badge2" class="cart-badge" style="display:none">0</div></div></div>
<div class="p-body">
<div class="p-img-side"><div class="p-img-main"><div class="arrow left" onclick="prevImg()">‹</div><img id="pImg"><div class="arrow right" onclick="nextImg()">›</div></div><div class="thumbs" id="thumbs"></div></div>
<div class="p-info"><h1 id="pName"></h1><div>₱900.00 PHP</div><div class="sizes"><div class="size active" onclick="pickSize(this)">S</div><div class="size" onclick="pickSize(this)">M</div><div class="size" onclick="pickSize(this)">L</div><div class="size" onclick="pickSize(this)">XL</div><div class="size" onclick="pickSize(this)">2XL</div></div><div style="display:flex;border:1px solid #ccc;width:fit-content;margin-top:12px;border-radius:8px;overflow:hidden"><button onclick="changeQty(-1)" style="width:40px;height:36px;border:0;background:#fff">−</button><span id="qty" style="width:40px;text-align:center;line-height:36px">1</span><button onclick="changeQty(1)" style="width:40px;height:36px;border:0;background:#fff">+</button></div><button id="addBtn" class="btn btn-black" onclick="addToCart()">ADD TO CART</button><button id="codBtn" class="btn btn-black2" onclick="addToCart()">🛒 BUY WITH COD</button><div id="chartBtn" class="sizechart-btn" onclick="openSizeChart()">VIEW SIZE CHART →</div></div>
</div>
</div>
<div id="sizeChartModal" onclick="closeSizeChart()"><img id="sizeChartImg"></div>
<div id="cartOverlay" onclick="closeCart()"></div>
<div id="cartDrawer"><div class="cart-head"><h2>Your cart</h2><span onclick="closeCart()" style="cursor:pointer">X</span></div><div class="cart-items" id="cartItems"></div><div style="padding:20px;border-top:1px solid #e5e5e5"><div style="display:flex;justify-content:space-between;font-weight:800"><span>Subtotal</span><span id="subtotal">₱0.00</span></div><button class="btn btn-black2" style="margin-top:12px">🛒 BUY WITH COD</button><button class="btn btn-black" style="margin-top:8px">CHECK OUT</button></div></div>
<div id="modal" onclick="this.style.display='none'" style="position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center"><img id="modalImg" style="max-width:95%;max-height:90vh"></div>
<script>
const tees=[
{img:"https://i.imgur.com/rM9FnTG.png",name:"COZY TEE BLACK",price:900,images:["https://i.imgur.com/rM9FnTG.png","https://i.imgur.com/IW3vnNm.jpeg"],chart:"https://i.imgur.com/0y5JNJr.jpeg",soldout:true},
{img:"https://i.imgur.com/y1bwuFF.png",name:"COZY TEE WHITE",price:900,images:["https://i.imgur.com/y1bwuFF.png","https://i.imgur.com/ch2Pxg3.jpeg"],chart:"https://i.imgur.com/sd2QwtY.jpeg",soldout:false},
{img:"https://i.imgur.com/TYSYmj1.png",name:"COZY SHORTS BLACK",price:900,images:["https://i.imgur.com/TYSYmj1.png","https://i.imgur.com/f0rMVGu.jpeg"],chart:"https://i.imgur.com/VPjDjjM.jpeg",soldout:false},
{img:"https://i.imgur.com/7tNmDFO.png",name:"COZY SHORTS WHITE",price:900,images:["https://i.imgur.com/7tNmDFO.png","https://i.imgur.com/X4A2kot.jpeg"],chart:"https://i.imgur.com/2HEDqwe.jpeg",soldout:false},
{img:"https://i.imgur.com/CDKuXxt.png",name:"COZY TEE GREY",price:900,images:["https://i.imgur.com/CDKuXxt.png","https://i.imgur.com/Hbr1wFd.jpeg"],chart:"https://i.imgur.com/AUSAh7R.jpeg",soldout:false},
{img:"https://i.imgur.com/e6rIBlV.png",name:"COZY TEE CREAM",price:900,images:["https://i.imgur.com/e6rIBlV.png","https://i.imgur.com/srf1dOA.jpeg"],chart:null,soldout:false},
{img:"https://i.imgur.com/ty9cyvl.png",name:"COZY HOODIE BLACK",price:1200,images:["https://i.imgur.com/ty9cyvl.png","https://i.imgur.com/IWqEKkJ.jpeg"],chart:null,soldout:false},
{img:"https://i.imgur.com/HOqhErH.png",name:"COZY HOODIE WHITE",price:1200,images:["https://i.imgur.com/HOqhErH.png","https://i.imgur.com/o1UOJrQ.jpeg"],chart:"https://i.imgur.com/qT2BtWm.jpeg",soldout:false},
];
const galleryPics=["https://i.imgur.com/ZUE63Du.jpeg","https://i.imgur.com/S33CFqt.jpeg","https://i.imgur.com/mrPv4Lg.jpeg","https://i.imgur.com/385oIll.jpeg","https://i.imgur.com/mk4Xksn.jpeg","https://i.imgur.com/zX2LkBM.jpeg","https://i.imgur.com/YpA5yF8.jpeg","https://i.imgur.com/rHxWn1O.jpeg","https://i.imgur.com/hRAzh46.jpeg","https://i.imgur.com/jk0Tq8L.jpeg","https://i.imgur.com/3RptbR7.jpeg","https://i.imgur.com/FwGlaZ4.jpeg"];
let current=null,currentIdx=0,cart=[],q=1,currentPage='store';
function renderStore(list){
  document.getElementById('storeGrid').innerHTML=list.map(t=>{
    let i=tees.indexOf(t);
    return `<div class="card" onclick="openProduct(${i})"><div class="img-wrap"><img class="img-main" src="${t.images[0]}"><img class="img-hover" src="${t.images[1]||t.images[0]}"></div><p>${t.name}</p>${t.soldout?'<div class="soldout-pill">Sold out</div>':''}</div>`;
  }).join("");
}
renderStore(tees);
document.getElementById('galleryGrid').innerHTML=galleryPics.map(p=>`<div class="gallery-card" onclick="openGallery('${p}')"><img src="${p}"></div>`).join("");
function showLoaderThen(cb){document.getElementById('loader').classList.add('show');setTimeout(()=>{document.getElementById('loader').classList.remove('show');cb();},400);}
function showStoreTab(){currentPage='store';showLoaderThen(()=>{document.getElementById('storePage').classList.add('active');document.getElementById('galleryPage').classList.remove('active');document.getElementById('navStore').classList.add('active');document.getElementById('navGallery').classList.remove('active')})}
function showGalleryTab(){currentPage='gallery';showLoaderThen(()=>{document.getElementById('galleryPage').classList.add('active');document.getElementById('storePage').classList.remove('active');document.getElementById('navGallery').classList.add('active');document.getElementById('navStore').classList.remove('active')})}
function showStoreTabWithoutLoader(){currentPage='store';document.getElementById('storePage').classList.add('active');document.getElementById('galleryPage').classList.remove('active');document.getElementById('navStore').classList.add('active');document.getElementById('navGallery').classList.remove('active')}
function showGalleryTabWithoutLoader(){currentPage='gallery';document.getElementById('galleryPage').classList.add('active');document.getElementById('storePage').classList.remove('active');document.getElementById('navGallery').classList.add('active');document.getElementById('navStore').classList.remove('active')}
function handleBack(){if(currentPage==='store'){goToIntro()}else{showStoreTab()}}
function backFromProduct(){document.getElementById('productPage').classList.remove('show');showStoreTabWithoutLoader()}
function goToIntro(){let g=document.getElementById('gate');g.style.display='flex';void g.offsetWidth;g.classList.remove('out');document.getElementById('main').classList.remove('show');document.body.style.overflow='hidden';try{document.getElementById('audio').pause()}catch(e){}}
function openProduct(i){current=tees[i];currentIdx=0;q=1;document.getElementById('qty').innerText=q;document.getElementById('pName').innerText=current.name;document.getElementById('pImg').src=current.images[0];document.getElementById('thumbs').innerHTML=current.images.map((im,idx)=>`<div class="thumb ${idx===0?'active':''}" onclick="goToImg(${idx})"><img src="${im}"></div>`).join("");document.getElementById('sizeChartImg').src=current.chart||"";document.getElementById('chartBtn').style.display=current.chart?'block':'none';let a=document.getElementById('addBtn'),c=document.getElementById('codBtn');if(current.soldout){a.innerText='SOLD OUT';a.disabled=true;c.innerText='SOLD OUT';c.disabled=true}else{a.innerText='ADD TO CART';a.disabled=false;c.innerHTML='🛒 BUY WITH COD';c.disabled=false}document.getElementById('productPage').classList.add('show')}
function goToImg(idx){currentIdx=idx;document.getElementById('pImg').src=current.images[currentIdx];document.querySelectorAll('.thumb').forEach((t,i)=>t.classList.toggle('active',i===currentIdx))}
function nextImg(){currentIdx=(currentIdx+1)%current.images.length;goToImg(currentIdx)}
function prevImg(){currentIdx=(currentIdx-1+current.images.length)%current.images.length;goToImg(currentIdx)}
function openSizeChart(){if(!current.chart)return;document.getElementById('sizeChartModal').classList.add('show')}
function closeSizeChart(){document.getElementById('sizeChartModal').classList.remove('show')}
function openGallery(p){document.getElementById('modalImg').src=p;document.getElementById('modal').style.display='flex'}
function pickSize(el){document.querySelectorAll('.size').forEach(s=>s.classList.remove('active'));el.classList.add('active')}
function changeQty(d){q=Math.max(1,q+d);document.getElementById('qty').innerText=q}
function addToCart(){if(current.soldout){alert('Sold out');return}let size=document.querySelector('.size.active').innerText;let ex=cart.find(c=>c.name===current.name&&c.size===size);if(ex)ex.qty+=q;else cart.push({img:current.images[0],name:current.name,size,qty:q,price:current.price});renderCart();document.getElementById('productPage').classList.remove('show');showStoreTabWithoutLoader();openCart()}
function renderCart(){let h='',t=0;cart.forEach(c=>{t+=c.price*c.qty;h+=`<div style="display:grid;grid-template-columns:60px 1fr auto;gap:12px;padding:16px 0;border-bottom:1px solid #eee"><img src="${c.img}" style="width:60px;height:70px;object-fit:contain"><div><div style="font-size:12px;font-weight:800">${c.name}</div><div style="font-size:11px;opacity:.6">Size: ${c.size}</div></div><div style="font-weight:700">₱${c.price*c.qty}</div></div>`});document.getElementById('cartItems').innerHTML=h||'<p style="text-align:center;padding:40px;opacity:.4">Empty</p>';document.getElementById('subtotal').innerText='₱'+t+'.00';let ct=cart.reduce((a,b)=>a+b.qty,0);document.getElementById('badge').style.display=ct?'flex':'none';document.getElementById('badge').innerText=ct;document.getElementById('badge2').style.display=ct?'flex':'none';document.getElementById('badge2').innerText=ct}
function openCart(){document.getElementById('cartDrawer').classList.add('show');document.getElementById('cartOverlay').classList.add('show')}
function closeCart(){document.getElementById('cartDrawer').classList.remove('show');document.getElementById('cartOverlay').classList.remove('show')}
function openSearch(){document.getElementById('searchOverlay').classList.add('show');doSearch('')}
function closeSearch(){document.getElementById('searchOverlay').classList.remove('show')}
function doSearch(v){let val=v.toLowerCase().trim();let f=val===""?tees:tees.filter(t=>t.name.toLowerCase().includes(val));document.getElementById('searchGrid').innerHTML=f.map(t=>{let i=tees.indexOf(t);return `<div class="card" onclick="closeSearch();openProduct(${i})"><div class="img-wrap"><img class="img-main" src="${t.images[0]}"><img class="img-hover" src="${t.images[1]||t.images[0]}"></div><p>${t.name}</p></div>`}).join("")}
function enterStore(){let g=document.getElementById('gate');g.classList.add('out');document.getElementById('main').classList.add('show');document.getElementById('loader').classList.add('show');document.body.style.overflow='auto';setTimeout(()=>{document.getElementById('loader').classList.remove('show');g.style.display='none';showStoreTabWithoutLoader();document.getElementById('storePage').classList.add('active')},600);try{document.getElementById('audio').play()}catch(e){}}
function enterGallery(){let g=document.getElementById('gate');g.classList.add('out');document.getElementById('main').classList.add('show');document.getElementById('loader').classList.add('show');document.body.style.overflow='auto';setTimeout(()=>{document.getElementById('loader').classList.remove('show');g.style.display='none';showGalleryTabWithoutLoader();document.getElementById('galleryPage').classList.add('active')},600);try{document.getElementById('audio').play()}catch(e){}}
</script>
</body>
</html>
