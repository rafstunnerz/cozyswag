<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COZYSWAG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f2f2f2;color:#111;font-family:Helvetica;overflow:hidden}
#gate{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
#gate video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#gate::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55)}
.menu{position:relative;z-index:2;text-align:center;color:#fff;display:flex;flex-direction:column;align-items:center}
.menu .top-logo{width:340px;max-width:85vw;margin-bottom:18px}
.menu div.link{font-family:serif;font-size:82px;font-weight:900;margin:12px 0;cursor:pointer}
.menu div.link:hover{letter-spacing:12px}
#gate.out{transform:translateY(-100%);transition:.8s}
#main{display:none;background:#f2f2f2;min-height:100vh}
#main.show{display:block}
.page{display:none}
.page.active{display:block}
header{padding:18px 22px;background:#f2f2f2;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;border-bottom:1px solid #e5e5e5}
.back{cursor:pointer;font-size:11px;letter-spacing:3px;font-weight:900;padding:8px 14px;border:1px solid #111;border-radius:20px}
.title{text-align:center;font-size:22px;font-weight:900;letter-spacing:4px;margin:30px 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0}
.card{background:#f2f2f2;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.card img{width:100%;max-width:260px;object-fit:contain}
.card p{font-size:11px;letter-spacing:2px;margin-top:12px;font-weight:700}
/* GALLERY PICS - MAS MALAKI */
.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#e5e5e5}
.gallery-card{aspect-ratio:3/4;background:#000;overflow:hidden;cursor:pointer;position:relative}
.gallery-card img{width:100%;height:100%;object-fit:cover;transition:.4s}
.gallery-card:hover img{transform:scale(1.05)}
#modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:10px}
#modal.show{display:flex}
.modal-box{background:#000;width:100%;max-width:500px;position:relative}
.modal-box img{width:100%;height:auto;display:block}
</style>
</head>
<body>

<div id="gate">
<video autoplay loop muted playsinline>
<source src="https://i.imgur.com/ML8T7V0.mp4" type="video/mp4">
</video>
<div class="menu">
<img class="top-logo" src="https://i.imgur.com/CGvaEJO.gif">
<div class="link" onclick="enterStore()">STORE</div>
<div class="link" onclick="enterGallery()">GALLERY</div>
</div>
</div>

<div id="main">
<header>
<div class="back" onclick="goHome()">← BACK</div>
<div style="font-weight:900;letter-spacing:6px">COZYSWAG</div>
<div>🛒</div>
</header>

<div id="storePage" class="page">
<div class="title">STORE — NEW COLLECTION</div>
<div class="grid2" id="storeGrid"></div>
</div>

<div id="galleryPage" class="page">
<div class="title">GALLERY — COZYSWAG FAM</div>
<div class="gallery-grid" id="galleryGrid"></div>
</div>

<audio id="audio" loop preload="auto">
<source src="./sorry.mp3" type="audio/mpeg">
</audio>

<div id="modal" onclick="closeModal()">
<div class="modal-box" onclick="event.stopPropagation()">
<img id="modalImg" src="">
<div style="position:absolute;top:10px;right:10px;background:#fff;color:#000;padding:6px 12px;font-size:11px;letter-spacing:2px;font-weight:900;cursor:pointer" onclick="closeModal()">CLOSE X</div>
</div>
</div>
</div>

<script>
const tees=[
{img:"https://i.imgur.com/rM9FnTG.png",name:"COZY TEE BLACK"},
{img:"https://i.imgur.com/y1bwuFF.png",name:"COZY TEE WHITE"},
{img:"https://i.imgur.com/TYSYmj1.png",name:"COZY SHORTS BLACK"},
{img:"https://i.imgur.com/7tNmDFO.png",name:"COZY SHORTS WHITE"},
{img:"https://i.imgur.com/CDKuXxt.png",name:"COZY TEE GREY"},
{img:"https://i.imgur.com/e6rIBlV.png",name:"COZY TEE CREAM"},
{img:"https://i.imgur.com/ty9cyvl.png",name:"COZY HOODIE BLACK"},
{img:"https://i.imgur.com/HOqhErH.png",name:"COZY HOODIE WHITE"},
];

// GALLERY PICS MO BOSS
const galleryPics=[
"https://i.imgur.com/ZUE63Du.jpeg",
"https://i.imgur.com/S33CFqt.jpeg",
"https://i.imgur.com/mrPv4Lg.jpeg",
"https://i.imgur.com/385oIll.jpeg",
"https://i.imgur.com/mk4Xksn.jpeg",
"https://i.imgur.com/zX2LkBM.jpeg",
"https://i.imgur.com/YpA5yF8.jpeg",
"https://i.imgur.com/rHxWn1O.jpeg",
"https://i.imgur.com/hRAzh46.jpeg",
"https://i.imgur.com/jk0Tq8L.jpeg",
"https://i.imgur.com/3RptbR7.jpeg",
];

document.getElementById('storeGrid').innerHTML=tees.map(t=>`<div class="card" onclick="openProduct('${t.img}','${t.name}')"><img src="${t.img}"><p>${t.name}</p></div>`).join("");
document.getElementById('galleryGrid').innerHTML=galleryPics.map(p=>`<div class="gallery-card" onclick="openProduct('${p}','COZYSWAG')"><img src="${p}" loading="lazy"></div>`).join("");

function openProduct(img,name){document.getElementById('modalImg').src=img;document.getElementById('modal').classList.add('show');}
function closeModal(){document.getElementById('modal').classList.remove('show');}
function playMusic(){let a=document.getElementById('audio');a.volume=1;a.play().catch(()=>{});}
function enterStore(){document.getElementById('gate').classList.add('out');document.getElementById('main').classList.add('show');document.getElementById('storePage').classList.add('active');document.getElementById('galleryPage').classList.remove('active');document.body.style.overflow='auto';playMusic();}
function enterGallery(){document.getElementById('gate').classList.add('out');document.getElementById('main').classList.add('show');document.getElementById('galleryPage').classList.add('active');document.getElementById('storePage').classList.remove('active');document.body.style.overflow='auto';playMusic();}
function goHome(){document.getElementById('gate').classList.remove('out');document.getElementById('main').classList.remove('show');document.body.style.overflow='hidden';document.getElementById('audio').pause();}
</script>
</body>
</html>
