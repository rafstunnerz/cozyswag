<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f2f2f2;color:#111;font-family:Helvetica;overflow:hidden}
#gate{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;transition:.7s ease}
#gate video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

#gate.out{transform:translateY(-100%);pointer-events:none}

.page{display:none}.page.active{display:block}
header{padding:12px 20px;background:#f2f2f2;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:30}

.header-center{position:absolute;left:50%;transform:translateX(-50%)}

.nav-link{font-size:11px;letter-spacing:2px;font-weight:800;cursor:pointer;opacity:.6;padding:8px 0;border-bottom:2px solid transparent}

.icon-btn{width:24px;height:24px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}

.back{cursor:pointer;font-size:11px;letter-spacing:3px;font-weight:900;padding:10px 20px;border:1px solid #111;border-radius:30px;display:flex;align-items:center;gap:8px}
.header-logo{height:58px;cursor:pointer}
.title{text-align:center;font-size:18px;font-weight:900;letter-spacing:4px;padding:24px 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0}
.card{background:#f2f2f2;padding:20px 16px 32px;display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative}
.card img{width:100%;height:280px;object-fit:contain}
.card p{font-size:12px;letter-spacing:1.5px;margin-top:14px;font-weight:800;text-align:center}
.soldout-pill{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);border:1px solid #111;border-radius:20px;padding:6px 18px;font-size:11px;letter-spacing:1px;font-weight:700;background:#fff;white-space:nowrap}
.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.gallery-card{aspect-ratio:4/5;background:#000;overflow:hidden;cursor:pointer}
.gallery-card img{width:100%;height:100%;object-fit:cover}
#searchOverlay{position:fixed;inset:0;z-index:500;background:#f2f2f2;display:none;flex-direction:column}
#searchOverlay.show{display:flex}
.search-top{padding:14px 20px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #e5e5e5}
.search-top input{flex:1;border:none;background:transparent;font-size:16px;letter-spacing:1px;outline:none;font-weight:600}
.search-results{flex:1;overflow:auto;padding:20px}
.search-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.empty-search{text-align:center;padding:60px 20px;opacity:.5;font-size:13px}
#productPage{position:fixed;inset:0;z-index:90;background:#f2f2f2;display:none;overflow:auto}
#productPage.show{display:block}
.p-header{padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#f2f2f2;z-index:5}
.p-body{display:grid;grid-template-columns:1.2fr.8fr;min-height:calc(100vh - 60px)}
.p-img-side{background:#efefef;display:flex;flex-direction:column;position:relative}
.p-img-main{flex:1;padding:40px;display:flex;align-items:center;justify-content:center;min-height:520px;position:relative}
.p-img-main img{width:100%;max-width:520px;object-fit:contain}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;background:#fff;border:1px solid #111;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;font-weight:900;z-index:2}
.arrow.left{left:16px}.arrow.right{right:16px}
.thumbs{display:flex;gap:8px;padding:12px 20px;background:#f2f2f2;overflow:auto}
.thumb{width:86px;height:86px;min-width:86px;border:2px solid transparent;background:#fff;cursor:pointer}
.thumb.active{border-color:#111}
.thumb img{width:100%;height:100%;object-fit:cover}
.p-info{padding:36px 32px}
.sizes{display:flex;gap:8px;margin-top:12px}
.size{width:36px;height:36px;border:1px solid #111;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer}
.size.active{background:#111;color:#fff}
.btn{width:100%;padding:14px;border-radius:30px;border:0;font-weight:900;letter-spacing:1px;cursor:pointer;margin-top:14px;font-size:13px}
.btn-black{background:#111;color:#fff}
.btn-black2{background:#111;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px}
.sizechart-btn{margin-top:14px;font-size:11px;letter-spacing:2px;text-decoration:underline;cursor:pointer;opacity:.8;font-weight:700}
#sizeChartModal{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:20px}
#sizeChartModal.show{display:flex}
#sizeChartModal img{max-width:90vw;max-height:85vh;background:#fff;padding:10px}
#cartOverlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none}
#cartOverlay.show{display:block}
#cartDrawer{position:fixed;top:0;right:0;width:420px;max-width:92vw;height:100%;background:#f2f2f2;z-index:201;transform:translateX(100%);transition:.4s;display:flex;flex-direction:column}
#cartDrawer.show{transform:translateX(0)}
.cart-head{padding:22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5e5e5}
.cart-items{flex:1;overflow:auto;padding:0 22px}
.cart-badge{position:absolute;top:-2px;right:-4px;background:#111;color:#fff;font-size:9px;min-width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0 3px;font-weight:800}
#loader{position:fixed;inset:0;z-index:9999;background:#f2f2f2;display:none;align-items:center;justify-content:center;flex-direction:column}
#loader.show{display:flex}
#loader img{width:70px;height:70px;animation:spin.9s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
#loader p{margin-top:14px;font-size:10px;letter-spacing:4px;font-weight:900;opacity:.6}
@media(max-width:800px){.menu-gif{width:260px;max-width:72vw}.menu div.link{font-size:42px}.p-body{grid-template-columns:1fr}.p-img-main{min-height:400px;padding:24px}.header-logo{height:44px}.card img{height:220px}.header-right{gap:10px}.nav-link{font-size:9px;letter-spacing:1px}.back{padding:8px 14px;font-size:10px}}
</style>

  try{document.getElementById('audio').pause();}catch(e){}
}
function openProduct(i){current=tees[i];currentIdx=0;q=1;document.getElementById('qty').innerText=q;document.getElementById('pName').innerText=current.name;document.getElementById('pImg').src=current.images[0];document.getElementById('thumbs').innerHTML=current.images.map((im,idx)=>`<div class="thumb ${idx===0?'active':''}" onclick="goToImg(${idx})"><img src="${im}"></div>`).join("");if(current.chart){document.getElementById('sizeChartImg').src=current.chart;document.getElementById('chartBtn').style.display='block';}else{document.getElementById('chartBtn').style.display='none';}let addBtn=document.getElementById('addBtn');let codBtn=document.getElementById('codBtn');if(current.soldout){addBtn.innerText='SOLD OUT';addBtn.style.background='#ccc';addBtn.style.color='#666';addBtn.disabled=true;codBtn.innerText='SOLD OUT';codBtn.style.background='#ccc';codBtn.style.color='#666';codBtn.disabled=true;}else{addBtn.innerText='ADD TO CART';addBtn.style.background='#111';addBtn.style.color='#fff';addBtn.disabled=false;codBtn.innerHTML='🛒 BUY WITH CASH ON DELIVERY';codBtn.style.background='#111';codBtn.style.color='#fff';codBtn.disabled=false;}document.getElementById('productPage').classList.add('show');}
function goToImg(idx){currentIdx=idx;document.getElementById('pImg').src=current.images[currentIdx];document.querySelectorAll('.thumb').forEach((t,i)=>t.classList.toggle('active',i===currentIdx));}
function nextImg(){currentIdx=(currentIdx+1)%current.images.length;goToImg(currentIdx);}
function prevImg(){currentIdx=(currentIdx-1+current.images.length)%current.images.length;goToImg(currentIdx);}
function openSizeChart(){if(!current.chart) return;document.getElementById('sizeChartModal').classList.add('show');}
function closeSizeChart(){document.getElementById('sizeChartModal').classList.remove('show');}
function openGallery(p){document.getElementById('modalImg').src=p;document.getElementById('modal').style.display='flex';}
function pickSize(el){document.querySelectorAll('.size').forEach(s=>s.classList.remove('active'));el.classList.add('active');}
function changeQty(d){q=Math.max(1,q+d);document.getElementById('qty').innerText=q;}
function addToCart(){if(current.soldout){alert('Sold out na boss!');return;}let size=document.querySelector('.size.active').innerText;let exist=cart.find(c=>c.name===current.name && c.size===size);if(exist){exist.qty+=q;}else{cart.push({img:current.images[0],name:current.name,size:size,qty:q,price:current.price});}renderCart();document.getElementById('productPage').classList.remove('show');showStoreTabWithoutLoader();document.getElementById('storePage').classList.add('active');openCart();}
function renderCart(){let html='',total=0;cart.forEach((c)=>{total+=c.price*c.qty;html+=`<div style="display:grid;grid-template-columns:60px 1fr auto;gap:12px;padding:18px 0;border-bottom:1px solid #eee;align-items:center"><img src="${c.img}" style="width:60px;height:70px;object-fit:contain;background:#fff"><div><div style="font-size:12px;font-weight:800">${c.name}</div><div style="font-size:11px;opacity:.7">₱${c.price}.00<br>Size: ${c.size}</div></div><div style="font-weight:700;font-size:12px">₱${c.price*c.qty}.00</div></div>`;});document.getElementById('cartItems').innerHTML=html||'<p style="text-align:center;padding:40px;opacity:.5">Empty</p>';document.getElementById('subtotal').innerText='₱'+total+'.00 PHP';let count=cart.reduce((a,b)=>a+b.qty,0);document.getElementById('badge').style.display=count?'flex':'none';document.getElementById('badge').innerText=count;document.getElementById('badge2').style.display=count?'flex':'none';document.getElementById('badge2').innerText=count;}
function openCart(){document.getElementById('cartDrawer').classList.add('show');document.getElementById('cartOverlay').classList.add('show');}
function closeCart(){document.getElementById('cartDrawer').classList.remove('show');document.getElementById('cartOverlay').classList.remove('show');}
function openSearch(){document.getElementById('searchOverlay').classList.add('show');document.getElementById('searchInput').focus();doSearch(document.getElementById('searchInput').value);}
function closeSearch(){document.getElementById('searchOverlay').classList.remove('show');}
function doSearch(val){let v=val.toLowerCase().trim();let filtered=v===""?tees:tees.filter(t=>t.name.toLowerCase().includes(v));let grid=document.getElementById('searchGrid');let empty=document.getElementById('searchEmpty');if(filtered.length===0){grid.innerHTML="";empty.style.display="block";}else{empty.style.display="none";grid.innerHTML=filtered.map(t=>{let realIndex=tees.indexOf(t);return `<div class="card" onclick="closeSearch(); openProduct(${realIndex})"><img src="${t.img}"><p>${t.name}</p>${t.soldout?'<div class="soldout-pill">Sold out</div>':''}</div>`;}).join("");}}
function playMusic(){try{let a=document.getElementById('audio');a.volume=1;a.play().catch(()=>{});}catch(e){}}
function enterStore(){
  let gate = document.getElementById('gate');
  let main = document.getElementById('main');
  gate.classList.add('out');
  main.classList.add('show');
  document.getElementById('loader').classList.add('show');
  document.body.style.overflow='auto';
  setTimeout(()=>{
    document.getElementById('loader').classList.remove('show');
    gate.style.display='none';
    showStoreTabWithoutLoader();
    document.getElementById('storePage').classList.add('active');
  },700);
  playMusic();
}
function enterGallery(){
  let gate = document.getElementById('gate');
  let main = document.getElementById('main');
  gate.classList.add('out');
  main.classList.add('show');
  document.getElementById('loader').classList.add('show');
  document.body.style.overflow='auto';
  setTimeout(()=>{
    document.getElementById('loader').classList.remove('show');
    gate.style.display='none';
    showGalleryTabWithoutLoader();
    document.getElementById('galleryPage').classList.add('active');
  },700);
  playMusic();
}
</script>
</body>
</html>
