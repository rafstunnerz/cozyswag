<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COZYSWAG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Helvetica,Arial;background:#000;overflow:hidden}
#enter{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#000;cursor:pointer}
#enter img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#enter.overlay{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#enter.menu{position:relative;z-index:2;text-align:center;color:#fff}
#enter.menu div{font-family:serif;font-size:82px;font-weight:700;line-height:.95;letter-spacing:2px;margin:14px 0;text-shadow:0 4px 30px rgba(0,0,0,.9);transition:.2s;cursor:pointer}
#enter.menu div:hover{letter-spacing:10px;transform:scale(1.05)}
#enter.menu small{font-family:Helvetica;font-size:11px;letter-spacing:5px;opacity:.9;display:block;margin-top:30px}
#enter.hide{transform:translateY(-100%);transition:.8s ease;opacity:0;pointer-events:none}
#main{opacity:0;pointer-events:none;transition:.6s}
#main.show{opacity:1;pointer-events:auto}
body.entered{overflow:auto;background:#f7f5f2}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #eee;padding:18px 40px;display:flex;justify-content:space-between;align-items:center}
header b{letter-spacing:8px}
nav a{margin-left:20px;text-decoration:none;color:#111;font-size:12px;letter-spacing:2px;font-weight:700;cursor:pointer}
.white{padding:80px 40px;background:#f7f5f2}
.black{padding:80px 40px;background:#111;color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px}
.card{background:#fff;height:400px;display:flex;align-items:center;justify-content:center}
.card img{width:100%;height:100%;object-fit:contain}
.storeWrap{display:flex;align-items:center;gap:20px;margin-top:20px}
.imgBox{flex:1;height:560px;background:#fff;display:flex;align-items:center;justify-content:center}
.imgBox img{width:100%;height:100%;object-fit:contain}
.arrow{width:64px;height:64px;background:#000;color:#fff;border-radius:50%;border:0;font-size:22px;cursor:pointer}
#musicBtn{position:fixed;bottom:20px;right:20px;background:#fff;color:#000;padding:14px 22px;border-radius:30px;border:0;z-index:99;font-weight:900;letter-spacing:2px;font-size:12px;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.3)}
@media(max-width:700px){#enter.menu div{font-size:46px}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div id="enter" onclick="enterSite('store')">
<img class="bg" src="https://i.imgur.com/wIQrNXl.gif">
<div class="overlay"></div>
<div class="menu">
<div onclick="event.stopPropagation(); enterSite('store')">STORE</div>
<div onclick="event.stopPropagation(); enterSite('collection')">COLLECTION</div>
<div onclick="event.stopPropagation(); enterSite('gallery')">GALLERY</div>
<small>cozyswag.ph • CLICK TO ENTER + PLAY SORRY</small>
</div>
</div>

<div id="main">
<header><b>COZYSWAG</b><nav><a onclick="go('store')">STORE</a><a onclick="go('collection')">COLLECTION</a><a onclick="go('gallery')">GALLERY</a></nav></header>

<section class="white" id="store">
<h2 style="font-size:48px;font-weight:900">STORE — 8 TEES</h2>
<div class="storeWrap">
<button class="arrow" onclick="prev()">←</button>
<div class="imgBox"><img id="pImg"></div>
<button class="arrow" onclick="next()">→</button>
<div style="width:260px"><h3 id="pName"></h3><p id="pPrice" style="color:#888;margin-top:6px"></p><button style="margin-top:20px;background:#000;color:#fff;border:0;padding:14px 30px;border-radius:25px;width:100%;font-weight:700">ADD TO CART</button></div>
</div>
</section>

<section class="white" id="collection"><h2 style="font-size:48px;font-weight:900">COLLECTION</h2><div class="grid" id="collGrid"></div></section>
<section class="black" id="gallery"><h2 style="font-size:48px;font-weight:900">GALLERY</h2><div class="grid" id="galGrid"></div></section>

<footer style="padding:40px;text-align:center;font-size:11px;letter-spacing:3px;color:#888;background:#fff">© 2026 COZYSWAG</footer>

<audio id="bgMusic" loop preload="auto" playsinline crossorigin="anonymous">
<source src="https://cdn.jsdelivr.net/gh/rafstunnerz/cozyswag@main/music.mp3" type="audio/mpeg">
</audio>
<button id="musicBtn" onclick="toggleMusic()">♪ PLAY SORRY</button>
</div>

<script>
function enterSite(sec){
 document.getElementById('enter').classList.add('hide');
 document.getElementById('main').classList.add('show');
 document.body.classList.add('entered');
 setTimeout(()=>{document.getElementById(sec).scrollIntoView({behavior:'smooth'})},600);
 let m=document.getElementById('bgMusic');
 m.volume=1;
 m.muted=false;
 m.play().then(()=>{
   playing=true;
   document.getElementById('musicBtn').innerText="II PAUSE SORRY";
 }).catch(e=>{
   console.log(e);
   document.getElementById('musicBtn').innerText="CLICK ME TO PLAY SORRY!";
 });
}
function go(id){document.getElementById(id).scrollIntoView({behavior:'smooth'})}

const products=[
{ name:"TEE 01", price:"₱850", img:"https://i.imgur.com/rM9FnTG.png" },
{ name:"TEE 02", price:"₱850", img:"https://i.imgur.com/y1bwuFF.png" },
{ name:"TEE 03", price:"₱850", img:"https://i.imgur.com/TYSYmj1.png" },
{ name:"TEE 04", price:"₱850", img:"https://i.imgur.com/7tNmDFO.png" },
{ name:"TEE 05", price:"₱900", img:"https://i.imgur.com/CDKuXxt.png" },
{ name:"TEE 06", price:"₱900", img:"https://i.imgur.com/e6rIBlV.png" },
{ name:"TEE 07", price:"₱900", img:"https://i.imgur.com/ty9cyvl.png" },
{ name:"TEE 08", price:"₱950", img:"https://i.imgur.com/HOqhErH.png" }
];
let idx=0;
const pImg=document.getElementById("pImg"),pName=document.getElementById("pName"),pPrice=document.getElementById("pPrice");
function up(){pImg.src=products[idx].img;pName.innerText=products[idx].name;pPrice.innerText=products[idx].price}
function next(){idx=(idx+1)%products.length;up()}
function prev(){idx=(idx-1+products.length)%products.length;up()}
up();
document.getElementById("collGrid").innerHTML=products.map(p=>`<div class="card"><img src="${p.img}"></div>`).join("");
document.getElementById("galGrid").innerHTML=products.map(p=>`<div class="card" style="background:#222"><img src="${p.img}" style="object-fit:cover"></div>`).join("");
let playing=false;
function toggleMusic(){
 let m=document.getElementById('bgMusic');
 if(!playing){m.play().then(()=>{playing=true;document.getElementById('musicBtn').innerText="II PAUSE SORRY"});}
 else{m.pause();playing=false;document.getElementById('musicBtn').innerText="♪ PLAY SORRY";}
}
</script>
</body>
</html>
