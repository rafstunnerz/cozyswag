<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COZYSWAG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f2f2f2;color:#111;font-family:Helvetica;overflow:hidden}
#gate{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:#000;cursor:pointer;overflow:hidden}
#gate video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#gate::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.45)}
.menu{position:relative;z-index:2;text-align:center;color:#fff}
.menu div{font-family:serif;font-size:78px;font-weight:900;margin:12px 0;cursor:pointer}
.menu div:hover{letter-spacing:10px}
#gate.out{transform:translateY(-100%);transition:.8s}
#main{display:none;background:#f2f2f2;min-height:100vh}
#main.show{display:block}
header{padding:18px 22px;background:#f2f2f2;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
.logo-gif-wrap{text-align:center;padding:30px 0 10px;background:#f2f2f2}
.logo-gif-wrap img{width:220px;max-width:70%;height:auto}
.title{text-align:center;font-size:22px;font-weight:900;letter-spacing:4px;margin:20px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.card{background:#f2f2f2;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.card:hover{background:#eaeaea;transform:translateY(-3px)}
.card img{width:100%;max-width:260px;height:auto;object-fit:contain}
.card p{font-size:11px;letter-spacing:2px;margin-top:12px;text-align:center;font-weight:700}
#modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:20px}
#modal.show{display:flex}
.modal-box{background:#f2f2f2;width:100%;max-width:400px;padding:24px;text-align:center}
.modal-box img{width:100%;max-width:320px}
</style>
</head>
<body>

<div id="gate" onclick="enterSite('store')">
<video autoplay loop muted playsinline>
<source src="https://i.imgur.com/ML8T7V0.mp4" type="video/mp4">
</video>
<div class="menu">
<div onclick="event.stopPropagation();enterSite('store')">STORE</div>
<div onclick="event.stopPropagation();enterSite('gallery')">GALLERY</div>
<p style="font-size:11px;letter-spacing:4px;margin-top:22px">COZYSWAG.PH — CLICK TO ENTER</p>
</div>
</div>

<div id="main">
<header>
<div style="font-size:22px">☰</div>
<div style="font-weight:900;letter-spacing:6px">COZYSWAG</div>
<div style="display:flex;gap:16px">⌕ 🛒</div>
</header>

<div class="logo-gif-wrap">
<img src="https://i.imgur.com/ML8T7V0.gif" id="topLogo" alt="logo">
</div>

<div class="title">NEW COLLECTION</div>

<section id="store">
<div class="grid" id="storeGrid"></div>
</section>

<section id="gallery" style="padding-top:30px">
<div class="title">GALLERY</div>
<div class="grid" id="galleryGrid"></div>
</section>

<!-- MUSIC - TUTUGTOG PARIN PERO WALANG BUTTON -->
<audio id="audio" loop preload="auto">
<source src="./sorry.mp3" type="audio/mpeg">
<source src="https://cdn.jsdelivr.net/gh/rafstunnerz/cozyswag@main/sorry.mp3" type="audio/mpeg">
</audio>

<div id="modal" onclick="closeModal()">
<div class="modal-box" onclick="event.stopPropagation()">
<img id="modalImg" src="">
<h2 id="modalName" style="margin:16px 0 6px;font-size:16px;letter-spacing:2px"></h2>
<p style="font-size:11px;opacity:.6">₱1,200 — FREE SHIPPING</p>
<button onclick="closeModal()" style="margin-top:14px;width:100%;padding:14px;background:#000;color:#fff;border:0;letter-spacing:3px;font-weight:900;cursor:pointer">CLOSE</button>
</div>
</div>
</div>

<script>
const tees=[
{img:"https://i.imgur.com/rM9FnTG.png",name:"COZY TEE BLACK"},
{img:"https://i.imgur.com/y1bwuFF.png",name:"COZY TEE WHITE"},
{img:"https://i.imgur.com/TYSYmj1.png",name:"COZY SHORTS BLACK"},
{img:"https://i.imgur.com/7tNmDFO.png",name:"COZY SHORTS WHITE"},
{img:"https://i.imgur.com/CDKuXxt.png",name:"COZY TEE GREY"},
{img:"https://i.imgur.com/e6rIBlV.png",name:"COZY TEE CREAM"},
{img:"https://i.imgur.com/ty9cyvl.png",name:"COZY HOODIE BLACK"},
{img:"https://i.imgur.com/HOqhErH.png",name:"COZY HOODIE WHITE"},
];
function makeGrid(id){
document.getElementById(id).innerHTML=tees.map(t=>`
<div class="card" onclick="openProduct('${t.img}','${t.name}')">
<img src="${t.img}" loading="lazy"><p>${t.name}</p></div>`).join("");
}
makeGrid('storeGrid');makeGrid('galleryGrid');
function openProduct(img,name){
document.getElementById('modalImg').src=img;
document.getElementById('modalName').innerText=name;
document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
function enterSite(id){
document.getElementById('gate').classList.add('out');
document.getElementById('main').classList.add('show');
document.body.style.overflow='auto';
setTimeout(()=>document.getElementById(id).scrollIntoView({behavior:'smooth'}),700);
let a=document.getElementById('audio');a.volume=1;a.play().catch(()=>{});
}
</script>
</body>
</html>
