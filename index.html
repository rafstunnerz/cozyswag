<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COZYSWAG®</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:#fff;font-family:'Inter',sans-serif;overflow-x:hidden}
#gate{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:#000}
#gate video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6}
#gate.out{transform:translateY(-100%);transition:transform .9s cubic-bezier(.86,0,.07,1)}
.menu{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:10px}
.menu-gif{width:310px;max-width:82vw;margin-bottom:12px}
.menu .link{font-family:'Anton',sans-serif;font-size:64px;line-height:.85;letter-spacing:1px;cursor:pointer;transition:.25s}
.menu .link:hover{transform:scale(1.06);-webkit-text-stroke:1px #fff;color:transparent}
#main{display:none;min-height:100vh;background:#070707}
#main.show{display:block}
header{padding:16px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:40;background:rgba(8,8,8,.9);backdrop-filter:blur(16px);border-bottom:1px solid #151515}
.header-left,.header-right{display:flex;align-items:center;gap:20px}
.header-logo{height:36px;cursor:pointer}
.nav-link{font-size:10px;letter-spacing:3px;font-weight:900;opacity:.5;cursor:pointer;padding-bottom:4px;border-bottom:1px solid transparent;transition:.3s}
.nav-link.active{opacity:1;border-bottom:1px solid #fff}
.icon-btn{width:20px;height:20px;cursor:pointer;opacity:.8;transition:.2s;stroke:#fff;fill:none}
.icon-btn:hover{opacity:1;transform:scale(1.1)}
.title{font-family:'Anton',sans-serif;font-size:56px;letter-spacing:-1px;padding:60px 24px 20px}
.grid2{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#151515;border:1px solid #151515}
.card{background:#0c0c0c;cursor:pointer;position:relative;overflow:hidden}
.card img{width:100%;aspect-ratio:1;object-fit:cover;transition:.7s}
.card:hover img{transform:scale(1.07)}
.card p{font-size:10px;letter-spacing:2px;font-weight:800;text-align:center;padding:14px}
.soldout-pill{position:absolute;top:10px;left:10px;background:#fff;color:#000;font-size:9px;font-weight:900;padding:5px 9px}
#loader{position:fixed;inset:0;z-index:9999;background:#070707;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#loader.show{display:flex}
#loader img{width:64px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.grid2{grid-template-columns:1fr 1fr}.menu .link{font-size:42px}.title{font-size:34px}}
</style>
</head>
<body>

<!-- INTRO GATE WITH VIDEO -->
<div id="gate">
<video id="gateVideo" autoplay loop muted playsinline>
<source src="https://i.imgur.com/Mx1b6R2.mp4" type="video/mp4">
</video>
<div class="menu">
<img class="menu-gif" src="https://i.imgur.com/cvMDrYf.gif">
<div class="link" onclick="enterStore()">COLLECTION</div>
<div class="link" onclick="enterGallery()">GALLERY</div>
<div class="link" onclick="window.open('https://www.facebook.com/cozyswag','_blank')">STORY</div>
</div>
</div>

<!-- MAIN -->
<div id="main">
<header>
<div class="header-left">
<img class="header-logo" src="https://i.imgur.com/8Km9tLL.png" onclick="goHome()">
<div class="nav-link active" id="storeLink" onclick="showStoreTab()">STORE</div>
<div class="nav-link" id="galleryLink" onclick="showGalleryTab()">GALLERY</div>
<div class="nav-link" onclick="window.open('https://www.facebook.com/cozyswag','_blank')">STORY</div>
</div>
<div class="header-right">
<!-- 3 ICONS - SEARCH, ACCOUNT, BAG -->
<svg class="icon-btn" viewBox="0 0 24 24" stroke-width="1.5"><circle cx="11" cy="11" r="6"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
<svg class="icon-btn" viewBox="0 0 24 24" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
<svg class="icon-btn" viewBox="0 0 24 24" stroke-width="1.5" onclick="openCart()"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
<span style="font-size:10px;opacity:.6" id="cartCount">0</span>
</div>
</header>

<div id="storePage">
<div class="title">STORE</div>
<div class="grid2" id="storeGrid"></div>
</div>

<div id="galleryPage" style="display:none">
<div class="title">GALLERY</div>
<div class="grid2" id="galleryGrid"></div>
</div>
</div>

<div id="loader"><img src="https://i.imgur.com/8Km9tLL.png"><div style="font-family:Anton;letter-spacing:3px">LOADING</div></div>

<audio id="sorryAudio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

<script>
const tees = [
{name:"CS MESH LONGSLEEVE",price:900,images:["https://i.imgur.com/CfZQ0pB.jpeg"],soldout:false},
{name:"CS SWEATSHORT",price:850,images:["https://i.imgur.com/8Km9tLL.png"],soldout:false},
{name:"CS ALLOVER TEE",price:680,images:["https://i.imgur.com/3Wn6K4q.jpeg"],soldout:false},
{name:"CS EMBLEM TEE BLACK",price:600,images:["https://i.imgur.com/4d6aG8p.jpeg"],soldout:false},
{name:"CS EMBLEM TEE WHITE",price:600,images:["https://i.imgur.com/4d6aG8p.jpeg"],soldout:false},
{name:"CS SKULLCAP",price:400,images:["https://i.imgur.com/8Km9tLL.png"],soldout:false},
{name:"CS EMBLEM CHAIN",price:600,images:["https://i.imgur.com/CfZQ0pB.jpeg"],soldout:true},
{name:"CS GLITTERS CROP TOP",price:550,images:["https://i.imgur.com/3Wn6K4q.jpeg"],soldout:false}
];
const galleryPics = ["https://i.imgur.com/3Wn6K4q.jpeg","https://i.imgur.com/4d6aG8p.jpeg","https://i.imgur.com/CfZQ0pB.jpeg","https://i.imgur.com/8Km9tLL.png"];

function showLoaderThen(cb){const l=document.getElementById('loader');l.classList.add('show');setTimeout(()=>{l.classList.remove('show');cb();},800);}
function renderStore(){const g=document.getElementById('storeGrid');g.innerHTML='';tees.forEach(t=>{const d=document.createElement('div');d.className='card';d.innerHTML=`${t.soldout?'<div class=soldout-pill>SOLD OUT</div>':''}<img src="${t.images[0]}"><p>${t.name} — ₱${t.price}</p>`;g.appendChild(d);});}
function renderGallery(){const g=document.getElementById('galleryGrid');g.innerHTML='';galleryPics.forEach(s=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<img src="${s}">`;g.appendChild(d);});}
function enterStore(){showLoaderThen(()=>{document.getElementById('gate').classList.add('out');document.getElementById('main').classList.add('show');showStoreTab();});}
function enterGallery(){showLoaderThen(()=>{document.getElementById('gate').classList.add('out');document.getElementById('main').classList.add('show');showGalleryTab();});}
function showStoreTab(){document.getElementById('storePage').style.display='block';document.getElementById('galleryPage').style.display='none';document.getElementById('storeLink').classList.add('active');document.getElementById('galleryLink').classList.remove('active');renderStore();}
function showGalleryTab(){document.getElementById('galleryPage').style.display='block';document.getElementById('storePage').style.display='none';document.getElementById('galleryLink').classList.add('active');document.getElementById('storeLink').classList.remove('active');renderGallery();}
function goHome(){document.getElementById('gate').classList.remove('out');document.getElementById('main').classList.remove('show');}
function openCart(){alert('DM IG @cozyswag to order!')}
renderStore();renderGallery();
</script>
</body>
</html>
