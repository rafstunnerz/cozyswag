<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COZYSWAG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f2f2f2;color:#111;font-family:Helvetica;overflow:hidden}
#gate{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
#gate video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#gate::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.45)}
.menu{position:relative;z-index:2;text-align:center;color:#fff}
.menu div{font-family:serif;font-size:82px;font-weight:900;margin:18px 0;cursor:pointer;transition:.3s}
.menu div:hover{letter-spacing:12px}
#gate.out{transform:translateY(-100%);transition:.8s}
#main{display:none;background:#f2f2f2;min-height:100vh}
#main.show{display:block}
.page{display:none}
.page.active{display:block}
header{padding:18px 22px;background:#f2f2f2;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;border-bottom:1px solid #e5e5e5}
.back{cursor:pointer;font-size:11px;letter-spacing:3px;font-weight:900;padding:8px 14px;border:1px solid #111;border-radius:20px}
.logo{font-weight:900;letter-spacing:6px}
.title{text-align:center;font-size:22px;font-weight:900;letter-spacing:4px;margin:30px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.card{background:#f2f2f2;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.card img{width:100%;max-width:260px}
.card p{font-size:11px;letter-spacing:2px;margin-top:12px;font-weight:700}
#modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:20px}
#modal.show{display:flex}
.modal-box{background:#f2f2f2;width:100%;max-width:380px;padding:24px;text-align:center}
</style>
</head>
<body>

<!-- GATE - WALANG CLICK TO ENTER, STORE/GALLERY LANG CLICKABLE -->
<div id="gate">
<video autoplay loop muted playsinline>
<source src="https://i.imgur.com/ML8T7V0.mp4" type="video/mp4">
</video>
<div class="menu">
<div onclick="enterStore()">STORE</div>
<div onclick="enterGallery()">GALLERY</div>
</div>
</div>

<div id="main">
<header>
<div class="back" onclick="goHome()">← BACK TO GATE</div>
<div class="logo">COZYSWAG</div>
<div style="display:flex;gap:16px">⌕ 🛒</div>
</header>

<!-- STORE PAGE LANG -->
<div id="storePage" class="page">
<div class="title">STORE — NEW COLLECTION</div>
<div class="grid" id="storeGrid"></div>
</div>

<!-- GALLERY PAGE LANG -->
<div id="galleryPage" class="page">
<div class="title">GALLERY</div>
<div class="grid" id="galleryGrid"></div>
</div>

<audio id="audio" loop preload="auto">
<source src="./sorry.mp3" type="audio/mpeg">
<source src="https://cdn.jsdelivr.net/gh/rafstunnerz/cozyswag@main/sorry.mp3" type="audio/mpeg">
</audio>

<div id="modal" onclick="closeModal()">
<div class="modal-box" onclick="event.stopPropagation()">
<img id="modalImg" src="" style="width:100%">
<h2 id="modalName" style="margin:14px 0 6px;font-size:15px;letter-spacing:2px"></h2>
<button onclick="closeModal()" style="margin-top:14px;width:100%;padding:12px;background:#000;color:#fff;border:0;letter-spacing:2px;font-weight:900">CLOSE</button>
</div>
</div>
</div>

<script>
const tees=[
{img:"https://i.imgur.com/rM9FnTG.png",name:"COZY TEE BLACK"},
{img:"https://i.imgur.com/y1bwuFF.png",name:"COZY TEE WHITE"},
{img:"https://i.imgur.com/TYSYmj1.png",name:"COZY SHORTS BLACK"},
{img:"https://i.imgur.com/7tNmDFO.png",name:"COZY SHORTS WHITE"},
{img:"https://i.imgur.com/CDKuXxt.png",name:"COZY TEE GREY"},
{img:"https://i.imgur.com/e6rIBlV.png",name:"COZY TEE CREAM"},
{img:"https://i.imgur.com/ty9cyvl.png",name:"COZY HOODIE BLACK"},
{img:"https://i.imgur.com/HOqhErH.png",name:"COZY HOODIE WHITE"},
];

function makeGrid(id){
document.getElementById(id).innerHTML=tees.map(t=>`<div class="card" onclick="openProduct('${t.img}','${t.name}')"><img src="${t.img}"><p>${t.name}</p></div>`).join("");
}
makeGrid('storeGrid');makeGrid('galleryGrid');

function openProduct(img,name){
document.getElementById('modalImg').src=img;
document.getElementById('modalName').innerText=name;
document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}

function playMusic(){let a=document.getElementById('audio');a.volume=1;a.play().catch(()=>{});}

function enterStore(){
document.getElementById('gate').classList.add('out');
document.getElementById('main').classList.add('show');
document.getElementById('storePage').classList.add('active');
document.getElementById('galleryPage').classList.remove('active');
document.body.style.overflow='auto';
playMusic();
}
function enterGallery(){
document.getElementById('gate').classList.add('out');
document.getElementById('main').classList.add('show');
document.getElementById('galleryPage').classList.add('active');
document.getElementById('storePage').classList.remove('active');
document.body.style.overflow='auto';
playMusic();
}
function goHome(){
document.getElementById('gate').classList.remove('out');
document.getElementById('main').classList.remove('show');
document.body.style.overflow='hidden';
document.getElementById('audio').pause();
}
</script>
</body>
</html>
