<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COZYSWAG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f2f2f2;color:#111;font-family:Helvetica;overflow:hidden}
#gate{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
#gate video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#gate::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55)}
.menu{position:relative;z-index:2;text-align:center;color:#fff;display:flex;flex-direction:column;align-items:center;width:100%;padding:20px}
.menu .top-logo{width:320px;max-width:80vw;margin-bottom:22px}
.menu div.link{font-family:serif;font-size:72px;font-weight:900;margin:10px 0;cursor:pointer;letter-spacing:1px}
#gate.out{transform:translateY(-100%);transition:.7s}
#main{display:none;background:#f2f2f2;min-height:100vh}
#main.show{display:block}
.page{display:none}
.page.active{display:block}
header{padding:16px 18px;background:#f2f2f2;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;border-bottom:1px solid #e5e5e5}
.back{cursor:pointer;font-size:11px;letter-spacing:3px;font-weight:900;padding:8px 14px;border:1px solid #111;border-radius:20px}
.title{text-align:center;font-size:18px;font-weight:900;letter-spacing:4px;margin:24px 0 12px;padding:0 20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#e5e5e5}
.card{background:#f2f2f2;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.card img{width:100%;max-width:100%;height:180px;object-fit:contain}
.card p{font-size:10px;letter-spacing:1.5px;margin-top:10px;font-weight:700;text-align:center}
.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#e5e5e5}
.gallery-card{aspect-ratio:4/5;background:#000;overflow:hidden;cursor:pointer}
.gallery-card img{width:100%;height:100%;object-fit:cover}
#modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:0}
#modal.show{display:flex}
.modal-box{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;padding:20px}
.modal-box img{max-width:100%;max-height:85vh;width:auto;height:auto;object-fit:contain}
.close{position:absolute;top:16px;right:16px;background:#fff;color:#000;padding:8px 14px;font-size:11px;letter-spacing:2px;font-weight:900;border-radius:20px;cursor:pointer}

/* CP OPTIMIZED */
@media(max-width:600px){
.menu div.link{font-size:56px}
.menu .top-logo{width:260px}
.title{font-size:16px;letter-spacing:3px}
.card{padding:12px}
.card img{height:150px}
.gallery-card{aspect-ratio:3/4}
}
</style>
</head>
<body>

<div id="gate">
<video autoplay loop muted playsinline>
<source src="https://i.imgur.com/ML8T7V0.mp4" type="video/mp4">
</video>
<div class="menu">
<img class="top-logo" src="https://i.imgur.com/CGvaEJO.gif">
<div class="link" onclick="enterStore()">STORE</div>
<div class="link" onclick="enterGallery()">GALLERY</div>
</div>
</div>

<div id="main">
<header>
<div class="back" onclick="goHome()">← BACK</div>
<div style="font-weight:900;letter-spacing:5px;font-size:14px">COZYSWAG</div>
<div style="font-size:18px">🛒</div>
</header>

<div id="storePage" class="page">
<div class="title">NEW COLLECTION</div>
<div class="grid2" id="storeGrid"></div>
</div>

<div id="galleryPage" class="page">
<div class="title">GALLERY — COZYSWAG FAM</div>
<div class="gallery-grid" id="galleryGrid"></div>
</div>

<audio id="audio" loop preload="auto">
<source src="./sorry.mp3" type="audio/mpeg">
</audio>

<div id="modal" onclick="closeModal()">
<div class="modal-box" onclick="event.stopPropagation()">
<img id="modalImg" src="">
<div class="close" onclick="closeModal()">CLOSE X</div>
</div>
</div>
</div>

<script>
const tees=[
{img:"https://i.imgur.com/rM9FnTG.png",name:"COZY TEE BLACK"},
{img:"https://i.imgur.com/y1bwuFF.png",name:"COZY TEE WHITE"},
{img:"https://i.imgur.com/TYSYmj1.png",name:"COZY SHORTS BLACK"},
{img:"https://i.imgur.com/7tNmDFO.png",name:"COZY SHORTS WHITE"},
{img:"https://i.imgur.com/CDKuXxt.png",name:"COZY TEE GREY"},
{img:"https://i.imgur.com/e6rIBlV.png",name:"COZY TEE CREAM"},
{img:"https://i.imgur.com/ty9cyvl.png",name:"COZY HOODIE BLACK"},
{img:"https://i.imgur.com/HOqhErH.png",name:"COZY HOODIE WHITE"},
];

const galleryPics=[
"https://i.imgur.com/ZUE63Du.jpeg",
"https://i.imgur.com/S33CFqt.jpeg",
"https://i.imgur.com/mrPv4Lg.jpeg",
"https://i.imgur.com/385oIll.jpeg",
"https://i.imgur.com/mk4Xksn.jpeg",
"https://i.imgur.com/zX2LkBM.jpeg",
"https://i.imgur.com/YpA5yF8.jpeg",
"https://i.imgur.com/rHxWn1O.jpeg",
"https://i.imgur.com/hRAzh46.jpeg",
"https://i.imgur.com/jk0Tq8L.jpeg",
"https://i.imgur.com/3RptbR7.jpeg",
"https://i.imgur.com/FwGlaZ4.jpeg",
];

document.getElementById('storeGrid').innerHTML=tees.map(t=>`<div class="card" onclick="openProduct('${t.img}')"><img src="${t.img}" loading="lazy"><p>${t.name}</p></div>`).join("");
document.getElementById('galleryGrid').innerHTML=galleryPics.map(p=>`<div class="gallery-card" onclick="openProduct('${p}')"><img src="${p}" loading="lazy"></div>`).join("");

function openProduct(img){document.getElementById('modalImg').src=img;document.getElementById('modal').classList.add('show');}
function closeModal(){document.getElementById('modal').classList.remove('show');}
function playMusic(){let a=document.getElementById('audio');a.volume=1;a.play().catch(()=>{});}
function enterStore(){document.getElementById('gate').classList.add('out');document.getElementById('main').classList.add('show');document.getElementById('storePage').classList.add('active');document.getElementById('galleryPage').classList.remove('active');document.body.style.overflow='auto';playMusic();}
function enterGallery(){document.getElementById('gate').classList.add('out');document.getElementById('main').classList.add('show');document.getElementById('galleryPage').classList.add('active');document.getElementById('storePage').classList.remove('active');document.body.style.overflow='auto';playMusic();}
function goHome(){document.getElementById('gate').classList.remove('out');document.getElementById('main').classList.remove('show');document.body.style.overflow='hidden';document.getElementById('audio').pause();}
</script>
</body>
</html>
